
name: Loan Default Prediction - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py dashboard.py main.py src

      - name: Verify project files
        run: |
          python -c "from pathlib import Path; assert Path('src/train.py').exists(); assert Path('src/monitor.py').exists(); print('Required project files found')"
